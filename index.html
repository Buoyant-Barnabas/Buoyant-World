ch input{width:100%;background:#121e30;border:1px solid var(--line);border-radius:13px;padding:12px 15px 12px 42px;color:var(--text);outline:none}.search:before{content:"⌕";position:absolute;left:15px;top:7px;font-size:25px;color:#8ca1bc}.topright{margin-left:auto;display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#69d7c5,#8aa7ff);color:#081321;font-weight:800}.content{max-width:1500px;margin:auto;padding:34px 36px 80px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.hero{border:1px solid #37516b;background:linear-gradient(120deg,#122b3b 0%,#18233b 55%,#292344 100%);border-radius:26px;padding:34px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"✧";position:absolute;right:8%;top:-48px;font-size:250px;color:#d6e8ff0c;pointer-events:none}.hero h1{font-size:clamp(32px,4vw,49px);line-height:1.08;margin:12px 0;max-width:720px;letter-spacing:-1.5px}.hero p{color:#b9c9df;max-width:680px;margin:0 0 22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:#18263a;color:var(--text);font-weight:650;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:#6e9baf}.btn.primary{background:linear-gradient(110deg,#6adbc6,#8ca8ff);border:0;color:#071321}.btn.ghost{background:#ffffff08}.btn.danger{color:#ff9da5;border-color:#743e4b}.btn.small{padding:7px 10px;font-size:12px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:32px 0 15px}.sectionhead h2{margin:3px 0 0;font-size:22px;letter-spacing:-.4px}.muted{color:var(--muted)}.tiny{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(145deg,#1 idth:310px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#b7c7db;font-weight:700}.field textarea{min-height:110px;resize:vertical}.field small{color:var(--muted)}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:25px}.pagehead h1{font-size:34px;letter-spacing:-1px;margin:4px 0}.pagehead p{margin:0;color:var(--muted);max-width:720px}.back{color:var(--accent);font-size:12px;cursor:pointer;margin-bottom:12px;display:inline-block}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin:20px 0}.tab{background:transparent;border:0;color:var(--muted);padding:9px 12px;border-radius:9px}.tab.active{background:#203747;color:var(--accent)}.modalwrap{position:fixed;inset:0;background:#020712c9;z-index:60;display:none;align-items:center;justify-content:center;padding:18px}.modalwrap.open{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#111d30;border:1px solid #3a506d;border-radius:20px;padding:24px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.close{border:0;background:#24354b;color:white;border-radius:9px;width:32px;height:32px}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty .big{font-size:38px;margin-bottom:8px}.flashcard{min-height:260px;display:grid;place-items:center;text-align:center;padding:35px;background:linear-gradient(145deg,#142d3c,#1b2541);border:1px solid #46627a;border-radius:22px;cursor:pointer}.flashcard .prompt{font-size:clamp(20px,3vw,28px);font-weight:750;max-width:650px}.flashcard .hint{color:var(--muted);font-size:11px;margin-bottom:12px}.reviewrating{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}.rating{flex:1;min-width:100px;border:1px solid var(--line);background:#152237;border-radius:12px;padding:12px;color:white}.rating.again{border-color:#a34e5c}.rating.easy{border-color:#398a78}.toast{position:fixed;bottom:22px;right:22px;background:#1c3541;border:1px solid #4e8c86;color:#eafffa;padding:12px 17px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.mobilehead{display:none}.footer{margin-top:55px;border-top:1px solid var(--line);padding-top:20px;color:#71839e;font-size:11px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.check input{accent-color:var(--accent)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.table th{color:#91a5c0}.hidden{display:none!important}
@media(max-width:1050px){.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.25s;width:275px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobilehead{display:block;border:0;background:transparent;color:white;font-size:22px}.topbar{padding:0 15px;height:64px}.content{padding:22px 15px 70px}.hero{padding:25px 21px}.hero h1{font-size:34px}.grid,.grid.two,.grid.four{grid-template-columns:1fr}.pagehead{display:block}.pagehead .actions{margin-top:15px}.topright .date{display:none}.domaincard{min-height:150px}.sectionhead{margin-top:25px}.modal{padding:18px}.toolbar input{max-width:none}.toolbar>*{flex:1}.sidebar:after{content:"";position:fixed;inset:0;pointer-events:none}}

<body><div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brandmark">✦</div><div><strong>My Space</strong><small>Personal Learning Universe</small></div></div>
 <div class="navlabel">Your universe</div>
 <button class="navbtn active" data-page="home"><span class="navico">⌂</span>Overview</button>
 <button class="navbtn" data-page="universe"><span class="navico">◎</span>Knowledge Universe<span class="navcount">12</span></button>
 <div class="navlabel">Learning toolkit</div>
 <button class="navbtn" data-page="flashcards"><span class="navico">▤</span>Flashcard Studio</button>
 <button class="navbtn" data-page="quiz"><span class="navico">◈</span>Quiz Arena</button>
 <button class="navbtn" data-page="notes"><span class="navico">✎</span>Notes & Journal</button>
 <button class="navbtn" data-page="library"><span class="navico">▣</span>Knowledge Library</button>
 <button class="navbtn" data-page="planner"><span class="navico">▦</span>Study Planner</button>
 <button class="navbtn" data-page="deadlines"><span class="navico">⏳</span>Deadlines</button>
 <button class="navbtn" data-page="progress"><span class="navico">↗</span>Progress Tracker</button>
 <div class="navlabel">Creation & growth</div>
 <button class="navbtn" data-page="projects"><span class="navico">◇</span>Projects & Experiments</button>
 <button class="navbtn" data-page="portfolio"><span class="navico">✧</span>Portfolios</button>
 <button class="navbtn" data-page="goals"><span class="navico">⚑</span>Goals & Milestones</button>
 <div class="sidebarbottom">A universe that grows with you.<br>Stored on this device • Back up often</div>
</aside>
<main class="main">
<header class="topbar"><button class="mobilehead" id="menuBtn">☰</button><div class="search"><input id="globalSearch" placeholder="Search your universe, subjects, decks, notes..." autocomplete="off"></div><div class="topright"><span class="date tiny muted" id="today"></span><span class="pill" id="cloud" onclick="accountModal()" style="cursor:pointer"></span><div class="avatar" id="avatar" title="Change your name" onclick="editName()" style="cursor:pointer">B</div></div></header>
<div class="content" id="view"></div>
</main></div>
<div class="modalwrap" id="modalwrap"><div class="modal" id="modal"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const DOMAINS=[
["Medicine & Health Sciences","⚕","Anatomy, physiology, biochemistry, clinical medicine and the science of human health.",["Anatomy","Physiology","Biochemistry","Histology","Embryology","Neuroanatomy","Pathology","Pharmacology","Microbiology & Immunology","Clinical Medicine","Surgery","Public Health & Epidemiology","Medical Ethics & Innovation"]],
["Natural Sciences & Technology","⚛","The physical, biological and computational principles shaping our world.",["Physics","Chemistry","Biology","Mathematics","Astronomy & Space Science","Computer Science","Artificial Intelligence","Engineering","Emerging Technologies"]],
["Communication, Rhetoric & Oratory","🎙","Speak clearly, reason persuasively, write powerfully and communicate with impact.",["Public Speaking","Debate","Rhetoric & Persuasion","Argumentation & Logic","Academic Writing","Professional Communication","Storytelling","Negotiation","Interpersonal Communication"]],
["Humanities & Global Affairs","🌍","Explore people, societies, ideas, histories, cultures and the forces shaping nations.",["History & Civilisations","Geography","Philosophy","Psychology","Economics","Politics & International Relations","Sociology & Anthropology","Culture & Religion","Nigerian & African Studies"]],
["Research, Evidence & Critical Inquiry","🔬","Ask better questions, evaluate evidence and produce rigorous, ethical research.",["Research Methodology","Biostatistics","Data Analysis","Critical Thinking","Evidence-Based Practice","Scientific Literature","Academic Research & Writing","Research Ethics","Media & Information Literacy"]],
["Digital Skills & Creative Innovation","💡","Build useful things with technology, design, digital tools and entrepreneurial thinking.",["Programming & Web Development","AI Applications","Digital Productivity","Graphic Design","UI/UX Design","Entrepreneurship","Project Development","Cybersecurity & Privacy","Automation & No-Code"]],
["Personal Development & Leadership","🌱","Develop the habits, judgement, relationships and leadership to live deliberately.",["Leadership & Management","Self-Discipline & Habits","Productivity & Time Management","Emotional Intelligence","Decision-Making","Financial Literacy","Career Development","Relationships & Social Skills","Personal Philosophy & Life Planning"]],
["Arts, Music & Literature","🎨","Discover creative expression, artistic traditions, literature, music and performance.",["Literature & Creative Writing","Poetry","Literary Analysis","Music Theory","Music Appreciation","Musical Instruments","Visual Arts & Art History","Film & Cinema","Theatre & Performing Arts","Architecture & Design"]],
["Law & Legal Studies","⚖","Understand legal systems, rights, institutions, rules and the philosophy of law.",["Constitutional Law","Criminal Law","Contract Law","International Law","Human Rights","Medical Law","Jurisprudence","Administrative Law","Property Law"]],
["General Knowledge & Current Affairs","🧭","A broad window into discoveries, institutions, notable people, events and the wider world.",["World Facts","Nigerian Affairs","Current Events","Inventions & Discoveries","International Organisations","Notable People","Records & Milestones","General Trivia"]],
["Sports, Exercise & Human Performance","🏅","Understand sport, movement, training, competition and the science of performance.",["Exercise Physiology","Sports Medicine","Biomechanics","Sports Psychology","Athletic Training","Performance & Recovery","Sports History","Sports Administration"]],
["Languages & Linguistics","文","Study how language works and develop the ability to communicate across languages.",["Language Acquisition","Phonetics & Phonology","Grammar & Syntax","Semantics & Pragmatics","Sociolinguistics","Foreign Languages","Translation & Interpretation","Nigerian Languages","Language Preservation"]]
];
const KEY="myspace_universe_v1";
const fresh=()=>({domains:DOMAINS.map((d,i)=>({id:"d"+i,name:d[0],icon:d[1],description:d[2],subjects:d[3],custom:false})),decks:[],cards:[],reviews:[],notes:[],tasks:[],resources:[],projects:[],goals:[],portfolio:[],quizQuestions:[],deadlines:[],activity:[],settings:{name:"Barnabas",dailyNew:20,dailyReview:100}});
let db;try{db={...fresh(),...(JSON.parse(localStorage.getItem(KEY))||{})}}catch(e){db=fresh()}
function save(){db.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Could not save. Export a backup and free some browser space.")}renderStats();schedulePush()}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,10)}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2600)}
function domainName(id){return db.domains.find(d=>d.id===id)?.name||"Independent"}
function subjectOptions(selected=""){return db.domains.map(d=>`<optgroup label="${esc(d.name)}">${d.subjects.map(s=>`<option ${selected===d.id+"|"+s?"selected":""} value="${esc(d.id+"|"+s)}">${esc(s)}</option>`).join("")}</optgroup>`).join("")}
function openModal(title,body,foot=""){document.getElementById("modal").innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}${foot}`;document.getElementById("modalwrap").classList.add("open")}
function closeModal(){document.getElementById("modalwrap").classList.remove("open")}
function page(p,np){if(!np&&location.hash!=="#"+p)history.pushState(null,"","#"+p);const navp={domain:"universe",subject:"universe",generator:"flashcards"}[p]||p;document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===navp));document.getElementById("sidebar").classList.remove("open");render(p)}
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>page(b.dataset.page)));
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("modalwrap").addEventListener("click",e=>{if(e.target.id==="modalwrap")closeModal()});
document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
function renderStats(){let un=document.querySelector('[data-page="universe"] .navcount');if(un)un.textContent=db.domains.length;let av=document.getElementById("avatar");if(av&&db.settings)av.textContent=(db.settings.name||"B")[0].toUpperCase();let due=db.cards.filter(c=>!c.suspended&&(!c.due||c.due<=Date.now())).length;document.querySelector('[data-page="flashcards"] .navcount')?.remove();let n=document.createElement("span");n.className="navcount";n.textContent=due;document.querySelector('[data-page="flashcards"]').append(n)}
function pageHead(kicker,title,desc,buttons=""){return `<div class="pagehead"><div><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function btn(label,fn,cls=""){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function render(p="home"){let v=document.getElementById("view");const due=db.cards.filter(c=>!c.suspended&&(!c.due||c.due<=Date.now())).length;
if(p==="home"){v.innerHTML=`<section class="hero"><span class="eyebrow">YOUR PERSONAL LEARNING UNIVERSE</span><h1>A space to explore.<br>A system to become.</h1><p>Learn deeply, build boldly and connect ideas across every field that makes you curious. Your knowledge universe is yours to shape.</p><div class="actions">${btn("Explore the universe","page('universe')","primary")}${btn("Open Flashcard Studio","page('flashcards')","ghost")}</div></section>
${todayPanel()}
<div class="sectionhead"><div><span class="eyebrow">YOUR SPACE AT A GLANCE</span><h2>Learning dashboard</h2></div><span class="tiny muted">Your activity lives on this device</span></div>
<div class="grid four"><div class="card"><div class="stat">${db.domains.length}</div><div class="statlabel">Knowledge domains</div></div><div class="card"><div class="stat">${db.decks.length}</div><div class="statlabel">Flashcard decks</div></div><div class="card"><div class="stat">${due}</div><div class="statlabel">Cards due for review</div></div><div class="card"><div class="stat">${db.notes.length}</div><div class="statlabel">Personal notes</div></div></div>
<div class="sectionhead"><div><span class="eyebrow">START EXPLORING</span><h2>Your knowledge universe</h2></div>${btn("View all 12 domains →","page('universe')","small")}</div><div class="grid">${db.domains.slice(0,6).map(domainCard).join("")}</div>
<div class="sectionhead"><div><span class="eyebrow">TOOLS FOR LEARNING</span><h2>Your learning toolkit</h2></div></div><div class="grid two">${toolCard("▤","Flashcard Studio","Create, import and review cards with spaced repetition.","flashcards")}${toolCard("◈","Quiz Arena","Test your knowledge with custom quizzes.","quiz")}${toolCard("✎","Notes & Learning Journal","Capture insights and connect ideas.","notes")}${toolCard("▦","Study Planner","Turn intentions into focused study sessions.","planner")}</div>
<div class="footer">MY SPACE · Built to grow with your curiosity. <span style="float:right">Data stays on this device · Back up regularly</span></div>`}
if(p==="universe"){v.innerHTML=pageHead("KNOWLEDGE UNIVERSE","Explore your world","Twelve starting domains. Unlimited room to grow. Browse a domain, explore its subjects, or create a new area of knowledge.",btn("+ Add domain","addDomain()","primary"))+`<div class="toolbar"><input id="domainFilter" placeholder="Find a domain or subject..." oninput="filterDomains(this.value)"><select id="domainSort" onchange="sortDomains(this.value)"><option value="default">Default order</option><option value="az">A–Z</option></select></div><div class="grid" id="domainGrid">${db.domains.map(domainCard).join("")}</div>`}
if(p==="domain"){let id=window.currentDomain,d=db.domains.find(x=>x.id===id);if(!d){page("universe");return}v.innerHTML=`<span class="back" onclick="page('universe')">← All domains</span>${pageHead("KNOWLEDGE DOMAIN",`${d.icon} ${esc(d.name)}`,esc(d.description),btn("＋ Add subject","addSubject('"+d.id+"')","primary")+btn("Edit domain","editDomain('"+d.id+"')"))}<div class="sectionhead"><div><span class="eyebrow">SUBJECT DIRECTORY</span><h2>Explore this domain</h2></div><span class="muted tiny">${d.subjects.length} subjects</span></div><div class="grid two">${d.subjects.map(s=>`<div class="card interactive" onclick="openSubject('${d.id}',${JSON.stringify(s).replace(/"/g,'&quot;')})"><div class="statlabel">${esc(d.name)}</div><h3 style="margin-top:8px">${esc(s)}</h3><p>Open learning space, resources and study tools</p><span class="tag">Explore subject →</span></div>`).join("")}</div>`}

function renderGenerator(v){v.innerHTML=pageHead("FLASHCARD STUDIO · CARD CREATION","Material-to-card drafts","Paste lecture notes or extracted text. My Space will create editable draft cards for you to inspect and approve. This offline draft builder does not call an AI service.",btn("Back to decks","page('flashcards')"))+`<div class="card"><div class="field"><label>Choose destination deck</label><select id="genDeck">${db.decks.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></div><div class="field"><label>Paste your source material</label><textarea id="genText" style="min-height:230px" placeholder="Paste your lecture notes, textbook excerpt or study material here. Separate ideas into paragraphs or lines for better results."></textarea></div><div class="field"><label>Draft style</label><select id="genStyle"><option value="qa">Question and answer</option><option value="cloze">Cloze-style prompts</option></select></div>${btn("Generate editable drafts","generateDrafts()","primary")}</div><div id="draftResults"></div>`;if(!db.decks.length)document.getElementById("draftResults").innerHTML=`<div class="card empty">Create a deck before generating cards. ${btn("Create deck","newDeck()","primary")}</div>`}
function generateDrafts(){let text=document.getElementById("genText").value.trim(),deck=document.getElementById("genDeck").value;if(!text||!deck)return toast("Choose a deck and paste source material");let chunks=text.split(/\n+|(?<=[.!?])\s+(?=[A-Z])/).map(x=>x.trim()).filter(x=>x.length>35);if(!chunks.length)chunks=[text];let drafts=chunks.slice(0,40).map((chunk,i)=>{let words=chunk.split(/\s+/);let key=words.slice(0,Math.min(7,words.length)).join(" ");return {front:document.getElementById("genStyle").value==="cloze"?chunk.replace(key,"[...]"):"Explain: "+key+(chunk.length>key.length?"…":""),back:chunk,deck,type:document.getElementById("genStyle").value==="cloze"?"cloze":"basic"}});window.pendingDrafts=drafts;document.getElementById("draftResults").innerHTML=`<div class="sectionhead"><div><span class="eyebrow">REVIEW BEFORE SAVING</span><h2>${drafts.length} draft cards</h2></div><button class="btn primary" onclick="approveDrafts()">Approve all drafts</button></div><div class="list">${drafts.map((d,i)=>`<div class="card"><div class="statrow"><strong>Draft ${i+1}</strong><button class="btn small danger" onclick="removeDraft(${i})">Remove</button></div><div class="field"><label>Front</label><textarea id="df${i}">${esc(d.front)}</textarea></div><div class="field"><label>Back</label><textarea id="db${i}">${esc(d.back)}</textarea></div></div>`).join("")}</div>`}
function removeDraft(i){window.pendingDrafts.splice(i,1);generateDraftDisplay()}
function generateDraftDisplay(){let drafts=window.pendingDrafts||[];let el=document.getElementById("draftResults");if(!el)return;el.innerHTML=`<div class="sectionhead"><h2>${drafts.length} draft cards remaining</h2><button class="btn primary" onclick="approveDrafts()">Approve all drafts</button></div>`+drafts.map((d,i)=>`<div class="card"><strong>Draft ${i+1}</strong><div class="field"><label>Front</label><textarea id="df${i}">${esc(d.front)}</textarea></div><div class="field"><label>Back</label><textarea id="db${i}">${esc(d.back)}</textarea></div><button class="btn small danger" onclick="removeDraft(${i})">Remove</button></div>`).join("")}
function approveDrafts(){let drafts=window.pendingDrafts||[];drafts.forEach((d,i)=>{let front=document.getElementById("df"+i)?.value||d.front,back=document.getElementById("db"+i)?.value||d.back;if(front.trim()&&back.trim())db.cards.push({id:uid(),deck:d.deck,type:d.type,front,back,tags:["generated-draft"],due:Date.now(),interval:0,reps:0,ease:2.5,suspended:false})});save();window.pendingDrafts=[];toast("Approved drafts saved to your deck");page("flashcards")}
function renderFlashcards(v){let due=db.cards.filter(c=>!c.suspended&&(!c.due||c.due<=Date.now()));v.innerHTML=pageHead("LEARNING TOOLKIT","Flashcard Studio","Build durable memory. Create cards manually, generate drafts from your material, import Anki decks and review at your own pace.",btn("+ New deck","newDeck()","primary")+btn("Import cards","importCards()"))+`<div class="grid four"><div class="card"><div class="stat">${db.decks.length}</div><div class="statlabel">Decks</div></div><div class="card"><div class="stat">${db.cards.length}</div><div class="statlabel">Total cards</div></div><div class="card"><div class="stat">${due.length}</div><div class="statlabel">Due now</div></div><div class="card"><div class="stat">${db.reviews.length}</div><div class="statlabel">Reviews logged</div></div></div><div class="sectionhead"><div><span class="eyebrow">YOUR MEMORY WORKSPACE</span><h2>Review queue</h2></div>${btn("Start review","startReview()","primary")}</div><div class="card"><div class="statrow"><div><strong>${due.length} cards ready to review</strong><div class="tiny muted">Cards are scheduled from your review ratings.</div></div><span class="pill">Spaced repetition</span></div><div class="progress"><span style="width:${db.cards.length?Math.round((db.cards.length-due.length)/db.cards.length*100):0}%"></span></div></div><div class="sectionhead"><div><span class="eyebrow">COLLECTIONS</span><h2>My decks</h2></div>${btn("＋ Create deck","newDeck()","small")}</div><div class="grid two">${db.decks.length?db.decks.map(d=>`<div class="card"><div class="statrow"><div><h3>${esc(d.name)}</h3><p>${esc(d.subject||"Independent deck")} · ${esc(d.domain?domainName(d.domain):"Independent")}</p></div><span class="domainicon">▤</span></div><div class="statrow" style="margin-top:16px"><span class="tiny muted">${db.cards.filter(c=>c.deck===d.id).length} cards</span><div class="actions">${btn("Study","startReview('"+d.id+"')","small primary")}${btn("Open","deckDetail('"+d.id+"')","small")}</div></div></div>`).join(""):`<div class="card empty"><div class="big">▤</div><strong>Your first deck is waiting</strong><p>Create a deck or import your Anki collection.</p>${btn("Create your first deck","newDeck()","primary")}</div>`}</div><div class="sectionhead"><div><span class="eyebrow">CREATE</span><h2>Make new cards</h2></div></div><div class="grid two">${toolCard("✎","Manual card creator","Write questions and answers, then save to any deck.","flashcards")}${toolCard("✦","Material-to-card drafts","Paste study text and turn it into editable draft cards.","generator")}</div><div id="reviewArea"></div>`}
function newDeck(domain="",subject=""){openModal("Create a deck",`<div class="field"><label>Deck name</label><input id="deckname" placeholder="e.g. Upper Limb Anatomy"></div><div class="field"><label>Domain (optional)</label><select id="deckdomain"><option value="">Independent deck</option>${db.domains.map(d=>`<option value="${d.id}" ${d.id===domain?"selected":""}>${esc(d.name)}</option>`).join("")}</select></div><div class="field"><label>Subject (optional)</label><input id="decksubject" value="${esc(subject)}" placeholder="e.g. Brachial plexus"></div><div class="field"><label>Description</label><textarea id="deckdesc"></textarea></div><button class="btn primary" onclick="let n=document.getElementById('deckname').value.trim();if(!n)return toast('Give your deck a name');let d={id:uid(),name:n,domain:document.getElementById('deckdomain').value,subject:document.getElementById('decksubject').value,description:document.getElementById('deckdesc').value};db.decks.push(d);save();closeModal();page('flashcards');deckDetail(d.id)">Create deck</button>`)}
function deckDetail(id){let d=db.decks.find(x=>x.id===id),cards=db.cards.filter(c=>c.deck===id);openModal(esc(d.name),`<p class="muted tiny">${esc(d.subject||"Independent")} · ${cards.length} cards</p><div class="actions">${btn("+ Add card","newCard('"+id+"')","primary")}${btn("Study deck","startReview('"+id+"')")}${btn("Rename","renameDeck('"+id+"')")}</div><div class="list" style="margin-top:16px">${cards.map(c=>`<div class="listitem"><div class="grow"><strong>${esc(c.front)}</strong><small>${esc(c.type)} · ${c.suspended?"Suspended":"Active"}</small></div><button class="btn small" onclick="editCard('${c.id}')">Edit</button><button class="btn small danger" onclick="removeCard('${c.id}')">×</button></div>`).join("")||'<div class="empty">No cards in this deck yet.</div>'}</div>`)}

function newCard(deck=""){let options=db.decks.map(d=>`<option value="${d.id}" ${d.id===deck?"selected":""}>${esc(d.name)}</option>`).join("");openModal("Create flashcard",`<div class="field"><label>Deck</label><select id="cfdeck">${options}</select></div><div class="field"><label>Card type</label><select id="cftype"><option value="basic">Basic</option><option value="reversed">Reversed</option><option value="cloze">Cloze deletion</option><option value="multiple">Multiple choice (stored as prompt/answer)</option><option value="image">Image-based (image URL supported)</option><option value="multi">Multi-part</option></select></div><div class="field"><label>Front / Prompt</label><textarea id="cffront" placeholder="Ask a focused question..."></textarea></div><div class="field"><label>Back / Answer</label><textarea id="cfback" placeholder="Write the expected answer..."></textarea></div><div class="field"><label>Tags (comma separated)</label><input id="cftags" placeholder="e.g. anatomy, exam, difficult"></div><button class="btn primary" onclick="saveCard()">Save flashcard</button>`)}
function saveCard(id=null){let deck=document.getElementById("cfdeck").value,front=document.getElementById("cffront").value.trim(),back=document.getElementById("cfback").value.trim();if(!front||!back)return toast("Add both a prompt and an answer");let data={deck,type:document.getElementById("cftype").value,front,back,tags:document.getElementById("cftags").value.split(",").map(x=>x.trim()).filter(Boolean),due:Date.now(),interval:0,reps:0,ease:2.5,suspended:false};if(id)Object.assign(db.cards.find(c=>c.id===id),data);else db.cards.push({id:uid(),...data});save();closeModal();toast("Flashcard saved");if(deck)deckDetail(deck)}
function editCard(id){let c=db.cards.find(x=>x.id===id);newCard(c.deck);document.getElementById("cffront").value=c.front;document.getElementById("cfback").value=c.back;document.getElementById("cftype").value=c.type;document.getElementById("cftags").value=(c.tags||[]).join(",");document.querySelector("#modal .btn.primary").onclick=()=>saveCard(id)}
function removeCard(id){if(!confirm("Delete this card?"))return;db.cards=db.cards.filter(c=>c.id!==id);save();closeModal();toast("Card deleted")}
function startReview(deckId=""){let queue=db.cards.filter(c=>(!deckId||c.deck===deckId)&&!c.suspended&&(!c.due||c.due<=Date.now()));if(!queue.length){toast("No cards due. Add cards or come back later.");return}let mode=confirm("Review mode\nOK = tap to flip cards\nCancel = type your answers")?"flip":"typed";queue.sort(()=>Math.random()-.5);reviewSession={queue,index:0,mode,shown:false};showReview()}
let reviewSession=null;
function showReview(){let r=reviewSession;if(!r)return;let c=r.queue[r.index];let area=document.getElementById("reviewArea");if(!area){page("flashcards");area=document.getElementById("reviewArea")}area.innerHTML=`<div class="sectionhead"><div><span class="eyebrow">FOCUSED RECALL · ${r.mode.toUpperCase()}</span><h2>Card ${r.index+1} of ${r.queue.length}</h2></div>${btn("End session","reviewSession=null;document.getElementById('reviewArea').innerHTML=''","small")}</div><div class="flashcard" onclick="${r.mode==="flip"&&!r.shown?"revealCard()":""}"><div><div class="hint">${r.shown?"ANSWER":"QUESTION · THINK BEFORE REVEALING"}</div><div class="prompt">${esc(r.shown?c.back:c.front)}</div>${r.mode==="flip"&&!r.shown?'<p class="muted tiny">Tap the card to reveal the answer</p>':""}</div></div>${r.mode==="typed"&&!r.shown?`<div class="field"><label>Your answer</label><textarea id="typedAnswer" placeholder="Recall the answer in your own words..."></textarea></div>${btn("Reveal expected answer","revealCard()","primary")}`:""}${r.shown?`<div class="card" style="margin-top:12px"><div class="tiny muted">EXPECTED ANSWER</div><p>${esc(c.back)}</p>${r.mode==="typed"?`<div class="tiny muted">YOUR RESPONSE</div><p>${esc(document.getElementById("typedAnswer")?.value||r.typed||"")}</p>`:""}<p class="tiny muted">How well did you recall it?</p><div class="reviewrating">${["again","hard","good","easy"].map(x=>`<button class="rating ${x}" onclick="rateCard('${x}')">${x[0].toUpperCase()+x.slice(1)}<br><small>${nextLabel(c,x)}</small></button>`).join("")}</div></div>`:""}`}
function revealCard(){if(reviewSession.mode==="typed")reviewSession.typed=document.getElementById("typedAnswer")?.value||"";reviewSession.shown=true;showReview()}
function rateCard(rating){let c=reviewSession.queue[reviewSession.index];Object.assign(c,sched(c,rating));c.reps=(c.reps||0)+1;markActive();db.reviews.push({id:uid(),card:c.id,rating,at:Date.now(),mode:reviewSession.mode});save();reviewSession.index++;reviewSession.shown=false;if(reviewSession.index>=reviewSession.queue.length){document.getElementById("reviewArea").innerHTML=`<div class="card empty"><div class="big">✦</div><h2>Session complete</h2><p>You reviewed ${reviewSession.queue.length} cards. Consistency compounds.</p>${btn("Back to decks","reviewSession=null;page('flashcards')","primary")}</div>`;reviewSession=null}else showReview()}
function importCards(){openModal("Import cards",`<p class="muted tiny">Import Anki .apkg packages (supported decks), CSV/TSV question-answer files, or a My Space JSON backup. Large or specialised Anki collections may need conversion through Anki's text export.</p><div class="field"><label>Choose file</label><input type="file" id="importFile" accept=".apkg,.colpkg,.csv,.tsv,.txt,.json"></div><div class="field"><label>Import into deck (for CSV/TSV)</label><select id="importDeck"><option value="">Create a new imported deck</option>${db.decks.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></div><label class="check"><input type="checkbox" id="hasHeader" checked> First CSV row contains column headings</label><div class="field"><label>Column separator</label><select id="sep"><option value="auto">Detect automatically</option><option value="tab">Tab</option><option value="comma">Comma</option><option value="semicolon">Semicolon</option></select></div><button class="btn primary" onclick="processImport()">Import file</button><p class="tiny muted">Anki .apkg support uses browser libraries loaded from a CDN. Internet access is needed for that import path.</p>`)}
async function processImport(){let f=document.getElementById("importFile").files[0];if(!f)return toast("Choose a file first");let ext=f.name.split(".").pop().toLowerCase();try{if(ext==="json"){let data=JSON.parse(await f.text());if(data.cards&&data.decks){if(!confirm("Merge this My Space backup with your current data?"))return;["decks","cards","reviews","notes","tasks","resources","projects","goals","portfolio","quizQuestions"].forEach(k=>{db[k]=db[k]||[];let have=new Set(db[k].map(x=>x.id));(data[k]||[]).forEach(x=>{if(!have.has(x.id))db[k].push(x)})});(data.domains||[]).forEach(d=>{if(!db.domains.some(x=>x.id===d.id))db.domains.push(d)});save();closeModal();toast("Backup merged");return}throw Error("This JSON is not a My Space backup")}if(ext==="csv"||ext==="tsv"||ext==="txt"){let text=await f.text(),sep=document.getElementById("sep").value;let delimiter=sep==="tab"?"\t":sep==="comma"?",":sep==="semicolon"?";":(ext==="tsv"?"\t":(text.split("\n")[0].includes("\t")?"\t":","));let rows=parseDelimited(text,delimiter);if(document.getElementById("hasHeader").checked)rows.shift();let deckId=document.getElementById("importDeck").value;if(!deckId){let d={id:uid(),name:f.name.replace(/\.[^.]+$/,""),domain:"",subject:"Imported cards"};db.decks.push(d);deckId=d.id}let count=0;rows.forEach(r=>{if(r.length>=2&&r[0].trim()&&r[1].trim()){db.cards.push({id:uid(),deck:deckId,type:"basic",front:r[0],back:r[1],tags:(r[2]||"").split(" ").filter(Boolean),due:Date.now(),interval:0,reps:0,ease:2.5,suspended:false});count++}});save();closeModal();toast(`Imported ${count} cards`);page("flashcards");return}if(ext==="apkg"||ext==="colpkg"){await importAnki(f);return}throw Error("Unsupported file type")}catch(e){toast("Import issue: "+e.message)}}
function parseDelimited(text,delimiter){let rows=[],row=[],cell="",q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&q&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===delimiter&&!q){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!q){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importAnki(file){if(!window.JSZip){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js")}if(!window.initSqlJs){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js")}let zip=await JSZip.loadAsync(file);let dbfile=zip.file("collection.anki2")||zip.file("collection.anki21");if(!dbfile)throw Error("No Anki collection database found in package");let bytes=await dbfile.async("uint8array");let SQL=await initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"+f});let sql=new SQL.Database(bytes);let rows=sql.exec("SELECT id, flds, tags, mid FROM notes");if(!rows.length)throw Error("No notes found");let decks={};try{let col=JSON.parse(new TextDecoder().decode(await zip.file("collection.anki2")?.async("uint8array")));}catch(e){}let deck={id:uid(),name:file.name.replace(/\.apkg$/i,""),domain:"",subject:"Imported from Anki"};db.decks.push(deck);let count=0;for(let row of rows[0].values){let fields=String(row[1]).split("\x1f");let front=stripHtml(fields[0]||"");let back=stripHtml(fields.slice(1).join(" / ")||"");if(!front)continue;db.cards.push({id:uid(),deck:deck.id,type:"basic",front,back,tags:String(row[2]||"").trim().split(/\s+/).filter(Boolean),due:Date.now(),interval:0,reps:0,ease:2.5,suspended:false,source:"Anki import"});count++}sql.close();save();closeModal();toast(`Imported ${count} Anki notes. Review templates and media for fidelity.`);page("flashcards")}
function stripHtml(s){let d=document.createElement("div");d.innerHTML=s;return d.textContent||d.innerText||""}
function loadScript(src){return new Promise((res,rej)=>{let s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(Error("Could not load import library"));document.head.append(s)})}
function renderQuiz(v){v.innerHTML=pageHead("LEARNING TOOLKIT","Quiz Arena","Challenge your recall with your own question bank. Create questions, practise in sessions and track your scores.",btn("+ Add question","addQuestion()","primary"))+`<div class="grid three"><div class="card"><div class="stat">${db.quizQuestions.length}</div><div class="statlabel">Questions in your bank</div></div><div class="card"><div class="stat">${db.quizQuestions.filter(q=>q.correct).length}</div><div class="statlabel">Correct answers logged</div></div><div class="card"><div class="stat">${db.quizQuestions.length?Math.round(db.quizQuestions.filter(q=>q.correct).length/db.quizQuestions.length*100):0}%</div><div class="statlabel">Lifetime accuracy</div></div></div><div class="sectionhead"><h2>Your question bank</h2>${btn("Start quiz","startQuiz()","primary")}</div><div class="list">${db.quizQuestions.map(q=>`<div class="listitem"><div class="grow"><strong>${esc(q.q)}</strong><small>${esc(q.category||"General")} · ${q.correct?"Correct once or more":"Not yet answered"}</small></div><button class="btn small danger" onclick="db.quizQuestions=db.quizQuestions.filter(x=>x.id!=='${q.id}');save();page('quiz')">Delete</button></div>`).join("")||'<div class="card empty">No questions yet. Add your own, or <button class="btn small primary" onclick="loadSampleQuestions()">load 8 sample questions</button></div>'}</div>`}

function startQuiz(){if(!db.quizQuestions.length)return toast("Add questions to your bank first");let qs=[...db.quizQuestions].sort(()=>Math.random()-.5),i=0,score=0;window.quizNext=()=>{i++;ask()};function ask(){if(i>=qs.length){markActive();save();openModal("Quiz complete",`<div class="empty"><div class="big">✦</div><h2>${score} / ${qs.length}</h2><p>You completed your quiz.</p></div><button class="btn primary" onclick="closeModal();page('quiz')">Finish</button>`);return}let q=qs[i];openModal(`Question ${i+1} of ${qs.length}`,`<h3>${esc(q.q)}</h3><div class="list">${q.options.map((o,j)=>`<button class="btn" style="text-align:left" onclick="quizAnswer(${j})">${"ABCD"[j]}. ${esc(o)}</button>`).join("")}</div><p class="tiny muted">Score: ${score}</p>`);window.quizAnswer=(n)=>{let good=n===q.answer;if(good){score++;q.correct=true}save();openModal(good?"Correct":"Not quite",`<p>${good?"Well done.":`Correct answer: ${"ABCD"[q.answer]}. ${esc(q.options[q.answer])}`}</p><button class="btn primary" onclick="quizNext()">Continue</button>`)} }ask()}

const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
let fs={left:1500,on:false,end:0,t:null};
function fTick(){fs.left=Math.max(0,Math.ceil((fs.end-Date.now())/1000));let e=document.getElementById("focusTime");if(e)e.textContent=fmt(fs.left);if(fs.left<=0){clearInterval(fs.t);fs={left:1500,on:false,end:0,t:null};markActive();toast("Focus session complete. Well done.");if(document.querySelector(".hero"))render("home")}}
function focusToggle(){if(fs.on){clearInterval(fs.t);fs.on=false}else{fs.on=true;fs.end=Date.now()+fs.left*1000;fs.t=setInterval(fTick,1000)}if(document.querySelector(".hero"))render("home")}

const SB_URL="PASTE_PROJECT_URL_HERE",SB_KEY="PASTE_PUBLISHABLE_KEY_HERE";
let sb=null,sbUser=null,sbCh=null,pushTimer=null,sbBusy=false;
const cloudOn=()=>SB_URL.startsWith("https://")&&SB_KEY.length>20&&!!window.supabase;
function cloudLabel(){let e=document.getElementById("cloud");if(e)e.textContent=!cloudOn()?"☁ Not set up":sbUser?"☁ Synced":"☁ Sign in"}
function schedulePush(){if(!sb||!sbUser||sbBusy)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,1500)}
async function push(){try{let r=await sb.from("user_data").upsert({user_id:sbUser.id,data:db,updated_at:new Date(db.updatedAt||Date.now()).toISOString()});if(r.error)throw r.error;cloudLabel()}catch(e){toast("Cloud save failed: "+(e.message||e))}}

async function pull(){try{let r=await sb.from("user_data").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle();if(r.error)throw r.error;let local=db.updatedAt||0;if(!r.data){await push();return}let rt=r.data.data.updatedAt||new Date(r.data.updated_at).getTime();if(rt>local+1000)adopt(r.data.data);else if(local>rt+1000)await push()}catch(e){toast("Cloud load failed: "+(e.message||e))}}

/* ===== ANKI-STYLE SCHEDULER ===== */
const STEPS=[1,10];
function sched(c,r){const now=Date.now(),M=6e4,D=864e5;let o={state:c.state||"new",step:c.step||0,interval:c.interval||0,ease:c.ease||2.5};
if(o.state==="new"||o.state==="learn"){
 if(r==="again"){o.state="learn";o.step=0;o.due=now+STEPS[0]*M}
 else if(r==="hard"){o.state="learn";o.due=now+(o.step===0?6:STEPS[o.step])*M}
 else if(r==="good"){if(o.step+1<STEPS.length){o.state="learn";o.step++;o.due=now+STEPS[o.step]*M}else{o.state="review";o.interval=Math.max(1,o.interval);o.due=now+o.interval*D}}
 else{o.state="review";o.interval=4;o.due=now+4*D}
}else{let iv=Math.max(1,o.interval);
 if(r==="again"){o.state="learn";o.step=0;o.ease=Math.max(1.3,o.ease-.2);o.interval=Math.max(1,Math.round(iv*.5));o.due=now+STEPS[0]*M}
 else{let f=r==="hard"?1.2:r==="good"?o.ease:o.ease*1.3;if(r==="hard")o.ease=Math.max(1.3,o.ease-.15);if(r==="easy")o.ease+=.15;o.interval=Math.max(iv+1,Math.round(iv*f));o.due=now+o.interval*D}}
return o}
function nextLabel(c,r){let ms=sched(c,r).due-Date.now();return ms<36e5?Math.max(1,Math.round(ms/6e4))+"m":ms<864e5?Math.round(ms/36e5)+"h":Math.round(ms/864e5)+"d"}

function mdLite(t){let out="",ul=false;String(t).split("\n").forEach(l=>{let e=esc(l.trim()).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");if(e.startsWith("- ")){if(!ul){out+="<ul>";ul=true}out+="<li>"+e.slice(2)+"</li>";return}if(ul){out+="</ul>";ul=false}if(e.startsWith("## "))out+="<h3>"+e.slice(3)+"</h3>";else if(e)out+="<p>"+e+"</p>"});if(ul)out+="</ul>";return out}

const PACKS={
"Anatomy":{lessons:[{t:"Brachial plexus",b:`## Intuition
The brachial plexus is the wiring bundle that carries nerves from the neck into the upper limb. It is built from the ventral rami of C5 to T1 and reorganised in five stages.
## Layout: Roots, Trunks, Divisions, Cords, Branches
- **Roots**: ventral rami of C5, C6, C7, C8 and T1.
- **Trunks**: upper (C5-C6), middle (C7), lower (C8-T1).
- **Divisions**: each trunk splits into an anterior and a posterior division.
- **Cords**: lateral, posterior and medial, named by their position relative to the axillary artery.
- **Terminal branches**: musculocutaneous, axillary, radial, median and ulnar nerves.
## Who comes from where
- Lateral cord: musculocutaneous nerve and the lateral root of the median nerve.
- Medial cord: ulnar nerve and the medial root of the median nerve.
- Posterior cord: axillary and radial nerves.
## Clinical anatomy
- Upper trunk injury (Erb palsy, C5-C6): the arm hangs adducted and medially rotated with the forearm extended and pronated, the waiter's tip posture.
- Lower trunk injury (Klumpke palsy, C8-T1): claw hand, with Horner syndrome if the T1 sympathetic fibres are involved.
- Long thoracic nerve injury paralyses serratus anterior and causes a winged scapula.
## Check yourself
Which nerve runs in the radial groove of the humerus, and what deficit follows a mid-shaft humeral fracture?`}],
cards:[["What are the roots of the brachial plexus?","Ventral rami of C5, C6, C7, C8 and T1."],["Name the five stages of the brachial plexus in order.","Roots, Trunks, Divisions, Cords, Branches."],["Which cord gives rise to the axillary and radial nerves?","The posterior cord."],["Which two cords contribute to the median nerve?","The lateral and medial cords."],["Which nerve is at risk in a fracture of the surgical neck of the humerus?","The axillary nerve, causing deltoid weakness and loss of sensation over the lateral shoulder."],["Which nerve is injured in a mid-shaft humeral fracture, and what is the sign?","The radial nerve, in the radial groove. Result: wrist drop."],["Erb palsy: which trunk and roots, and what posture?","Upper trunk (C5-C6). Arm adducted and medially rotated, forearm extended and pronated (waiter's tip)."],["Klumpke palsy: which trunk and roots, and what sign?","Lower trunk (C8-T1). Claw hand, with possible Horner syndrome."],["What does injury to the long thoracic nerve cause?","Winged scapula from paralysis of serratus anterior."]]},
"Philosophy":{lessons:[{t:"Epistemology: what counts as knowledge?",b:`## Intuition
Epistemology asks what knowledge is, where it comes from, and how far we can trust it.
## The classical definition
Knowledge has traditionally been analysed as **justified true belief**: you believe it, it is true, and you have good reasons.
## Gettier's challenge
In 1963 Edmund Gettier described cases where a belief is justified and true only by luck, so it does not feel like knowledge. This showed the classical definition is not sufficient and started decades of proposed repairs.
## Sources of knowledge
- Rationalism: reason is the chief source (Descartes, Leibniz).
- Empiricism: sense experience is the chief source (Locke, Berkeley, Hume).
- Kant's synthesis: knowledge begins with experience but is shaped by the mind's own categories, such as causality.
## Scepticism
Descartes doubted everything he could until he reached the thinking self, the cogito. Hume argued that induction, inferring the future from the past, cannot be justified without circular reasoning.
## Check yourself
Why does a Gettier case show that justified true belief is not enough for knowledge?`}],
cards:[["What is the classical analysis of knowledge?","Knowledge is justified true belief."],["What did Gettier (1963) show?","That justified true belief is not sufficient for knowledge, because a belief can be justified and true only by luck."],["Rationalism versus empiricism?","Rationalism: reason is the chief source of knowledge. Empiricism: sense experience is."],["What is Hume's problem of induction?","There is no non-circular justification for assuming the future will resemble the past."],["What does Descartes' cogito establish?","That the thinking self cannot be doubted: 'I think, therefore I am'."],["What is Kant's synthesis?","Knowledge begins with experience but is structured by innate categories of the mind, such as causality."]]}
};
